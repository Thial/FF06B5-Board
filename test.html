<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF06B5 Board</title>
    <style>
        @import url(https://fonts.googleapis.com/css?family=Jura);

    html, body {
        height: 100%;
        width: 100%;
    }

    body {
        margin: 0;
        overflow: hidden;
        background: linear-gradient(to bottom, #322, #223);
        font-family: 'Jura';
        cursor: initial;
    }
    canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        cursor: initial;
    }

    #resetBtn {
        position: absolute;
        top: 10px;
        left:50%;
        transform: translate(-50%, 0%);
        background: #222;
        border: 1px solid #444;
        padding: 10px 16px;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        font-family: 'Jura';
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    #resetBtn:hover { background: #333; }

    #fullscreenModal {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.95);
        z-index: 200;
        justify-content: center;
        align-items: center;
        cursor: pointer;
    }
    #fullscreenImage {
        max-width: 95%;
        max-height: 95%;
        object-fit: contain;
    }
    #closeModal {
        position: absolute;
        top: 20px;
        right: 30px;
        font-size: 40px;
        color: white;
        cursor: pointer;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255,255,255,0.2);
        border-radius: 50%;
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7/dist/pixi.min.js"></script></head>
<body>
    <button id="resetBtn">Reset</button>

<div id="fullscreenModal">
    <div id="closeModal">×</div>
    <img id="fullscreenImage" src="" alt="Fullscreen">
</div>

<script>
    const fullscreenModal = document.getElementById('fullscreenModal');
    const fullscreenImage = document.getElementById('fullscreenImage');
    const closeModal = document.getElementById('closeModal');

    const app = new PIXI.Application({
        resizeTo: window,
        transparent: true,
        autoDensity: true
    });
    document.body.appendChild(app.view);

    const gridGraphics = new PIXI.Graphics();
    app.stage.addChild(gridGraphics);

    const mainContainer = new PIXI.Container();
    app.stage.addChild(mainContainer);

    let offsetX = window.innerWidth / 2;
    let offsetY = window.innerHeight / 2;
    let scale = 0.05;
    let prevPinchDist = 0;
    let draggedCard = null;
    let dragOffX = 0;
    let dragOffY = 0;
    let isDraggingCanvas = false;
    let lastMX = 0;
    let lastMY = 0;

    const BASE_GRID = 80;
    const MIN_SPACING = 40;
    const MAJOR_MULT = 4;

    let theoryGridSizeMax = 2;
    let subTheoryGridSizeMax = 2;
    let cardGridSizeMax = 2;

    const TITLE_BAR_HEIGHT = 70;
    const IMAGE_HEIGHT = 400;
    const TEXT_HEIGHT = 230;
    const CARD_WIDTH = 400;
    const CARD_HEIGHT = TITLE_BAR_HEIGHT + IMAGE_HEIGHT + TEXT_HEIGHT;
    const CARD_GAP_X = 300;
    const CARD_GAP_Y = 50;
    const CARD_HALF_GAP_X = CARD_GAP_X / 2;
    const CARD_HALF_GAP_Y = CARD_GAP_Y / 2;

    const SUB_THEORY_GAP_X = 800;
    const SUB_THEORY_GAP_Y = 800;
    const SUB_THEORY_HALF_GAP_X = SUB_THEORY_GAP_X / 2;
    const SUB_THEORY_HALF_GAP_Y = SUB_THEORY_GAP_Y / 2;

    const THEORY_GAP_X = 800;
    const THEORY_GAP_Y = 800;
    const THEORY_HALF_GAP_X = THEORY_GAP_X / 2;
    const THEORY_HALF_GAP_Y = THEORY_GAP_Y / 2;

    let json;

    let subTheorySizeX = 0;
    let subTheorySizeY = 0;
    let subTheoryHalfSizeX = 0;
    let subTheoryHalfSizeY = 0;
    let theorySizeX = 0;
    let theorySizeY = 0;
    let theoryHalfSizeX = 0;
    let theoryHalfSizeY = 0;
    let sizeX = 0;
    let sizeY = 0;

    function w2sX(x) {
        return x * scale + offsetX;
    }

    function w2sY(y) {
        return y * scale + offsetY;
    }

    function w2sL(l) {
        return l * scale;
    }

    function createGradientTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 1;
        canvas.height = CARD_HEIGHT;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, CARD_HEIGHT);
        gradient.addColorStop(0, '#331111');
        gradient.addColorStop(1, '#191111');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 1, CARD_HEIGHT);
        return PIXI.Texture.from(canvas);
    }

    const gradientTexture = createGradientTexture();

    async function initialize() {
        fetch(`data.json?t=${Date.now()}`, { cache: 'no-store' })
            .then(response => {
                if (!response.ok) throw new Error('Failed to get data!');
                return response.text();
            })
            .then(data => {
                const cleanedJson = data.replace(/,\s*([\]}])/g, '$1');
                json = JSON.parse(cleanedJson);
                console.log(json);
                initializeData();
                calculatePositions();
                createTheoryTexts();
                createCards();
                addEventListeners();
                mainContainer.position.set(offsetX, offsetY);
                mainContainer.scale.set(scale);
                updateGrid();
                updateZoomAlphas();
            })
            .catch(err => console.error(err));
    }

    function initializeData() {
        json.cards.forEach(card => {
            // No need for calculateDescriptionLines or calculateDescriptionWords
        });

        json.theories.forEach(theory => {
            if ( theory.sub_theories === null || theory.sub_theories === undefined) {
                theory.sub_theories = [];
            }
            theory.sub_theories.forEach(subTheory => {
                subTheory.cards = [];
                json.cards.forEach(card => {
                    if (card.theory_id === theory.id && card.sub_theory_id === subTheory.id) {
                        card.theory_name = theory.name;
                        card.sub_theory_name = subTheory.name;
                        const source = json.sources.find(source => source.id === card.source_id);
                        card.source_name = source.name;
                        subTheory.cards.push(card);
                    }
                });
                const cardCount = subTheory.cards.length;
                const cardGridSize = Math.max(2, Math.ceil(Math.sqrt(cardCount)));
                subTheory.card_count = cardCount;
                subTheory.card_grid_size = cardGridSize;
            });
            theory.sub_theory_grid_size = Math.max(2, Math.ceil(Math.sqrt(theory.sub_theories.length)));
        });

        calculateSizes();
    }

    function calculateSizes() {
        theoryGridSizeMax = Math.max(2, Math.ceil(Math.sqrt(json.theories.length)));
        subTheoryGridSizeMax = Math.max(...json.theories.map(theory => theory.sub_theory_grid_size));
        json.theories.forEach(theory => {
            const subTheoryCardGridSizeMax = Math.max(... theory.sub_theories.map(subTheory => subTheory.card_grid_size));
            if (subTheoryCardGridSizeMax > cardGridSizeMax) {
                cardGridSizeMax = subTheoryCardGridSizeMax;
            }
        });
        // the max size of a sub theory
        subTheorySizeX = cardGridSizeMax * CARD_WIDTH + cardGridSizeMax * CARD_GAP_X;
        subTheorySizeY = cardGridSizeMax * CARD_HEIGHT + cardGridSizeMax * CARD_GAP_Y;
        subTheoryHalfSizeX = subTheorySizeX / 2;
        subTheoryHalfSizeY = subTheorySizeY / 2;
        // the max size of a theory
        theorySizeX = subTheorySizeX * subTheoryGridSizeMax + subTheoryGridSizeMax * SUB_THEORY_GAP_X;
        theorySizeY = subTheorySizeY * subTheoryGridSizeMax + subTheoryGridSizeMax * SUB_THEORY_GAP_Y;
        theoryHalfSizeX = theorySizeX / 2;
        theoryHalfSizeY = theorySizeY / 2;
        // the max size of all theories
        sizeX = theorySizeX * theoryGridSizeMax + theoryGridSizeMax * THEORY_GAP_X;
        sizeY = theorySizeY * theoryGridSizeMax + theoryGridSizeMax * THEORY_GAP_Y;
    }

    function calculatePositions() {
        calculateTheoryPositions();
        json.theories.forEach(theory => {
            calculateSubTheoryPositions(theory);
            theory.sub_theories.forEach(subTheory => {
                calculateCardPositions(subTheory);
            });
        });
    }

    function calculateTheoryPositions() {
        // the origin point
        const originX = 0 - sizeX / 2 + THEORY_HALF_GAP_X;
        const originY = 0 - sizeY / 2 + THEORY_HALF_GAP_Y;
        // calculate the origin of each theory
        let theoryGridX = 0;
        let theoryGridY = 0;
        json.theories.forEach(theory => {
            theory.x = originX + theoryGridX * ( theorySizeX + THEORY_GAP_X);
            theory.y = originY + theoryGridY * ( theorySizeY + THEORY_GAP_Y);
            theoryGridX++;
            if ( theoryGridX >= theoryGridSizeMax) {
                theoryGridX = 0;
                theoryGridY++;
            }
        });
    }

    function calculateSubTheoryPositions(theory) {
        let subTheoryGridX = 0;
        let subTheoryGridY = 0;
        theory.sub_theories.forEach(subTheory => {
            subTheory.x = theory.x + SUB_THEORY_HALF_GAP_X + subTheoryGridX * (subTheorySizeX + SUB_THEORY_GAP_X);
            subTheory.y = theory.y + SUB_THEORY_HALF_GAP_Y + subTheoryGridY * (subTheorySizeY + SUB_THEORY_GAP_Y);
            subTheoryGridX++;
            if (subTheoryGridX >= subTheoryGridSizeMax) {
                subTheoryGridX = 0;
                subTheoryGridY++;
            }
        });
    }

    function calculateCardPositions(subTheory) {
        let cardGridX = 0;
        let cardGridY = 0;
        subTheory.cards.forEach(card => {
            card.initial_x = subTheory.x + CARD_HALF_GAP_X + cardGridX * (CARD_WIDTH + CARD_GAP_X);
            card.initial_y = subTheory.y + CARD_HALF_GAP_Y + cardGridY * (CARD_HEIGHT + CARD_GAP_Y);
            card.x = card.initial_x;
            card.y = card.initial_y;
            cardGridX++;
            if (cardGridX >= cardGridSizeMax) {
                cardGridX = 0;
                cardGridY++;
            }
        });
    }

    function createTheoryTexts() {
        json.theories.forEach(theory => {
            const theoryRect = new PIXI.Graphics();
            theoryRect.beginFill('#00f');
            theoryRect.drawRect(theory.x, theory.y, theorySizeX, theorySizeY);
            theoryRect.endFill();
            mainContainer.addChild(theoryRect);

            const theoryText = new PIXI.Text(theory.name.toUpperCase(), {
                fontFamily: 'Jura',
                fontSize: 400,
                fill: 0xDD5555,
                fontWeight: 'bold',
                align: 'center'
            });
            theoryText.position.set(theory.x + theoryHalfSizeX, theory.y - 200);
            mainContainer.addChild(theoryText);

            theory.sub_theories.forEach(subTheory => {
                const subTheoryRect = new PIXI.Graphics();
                subTheoryRect.beginFill('#f0f');
                subTheoryRect.drawRect(subTheory.x, subTheory.y, subTheorySizeX, subTheorySizeY);
                subTheoryRect.endFill();
                mainContainer.addChild(subTheoryRect);

                const subTheoryText = new PIXI.Text(subTheory.name.toUpperCase(), {
                    fontFamily: 'Jura',
                    fontSize: 200,
                    fill: 0xCC4444,
                    fontWeight: 'bold',
                    align: 'center'
                });
                subTheoryText.position.set(subTheory.x + subTheoryHalfSizeX, subTheory.y - 200);
                mainContainer.addChild(subTheoryText);
            });
        });
    }

    function createCards() {
        json.cards.forEach(card => {
            const cardContainer = new PIXI.Container();
            cardContainer.position.set(card.x, card.y);
            mainContainer.addChild(cardContainer);
            card.container = cardContainer;

            const bgSprite = new PIXI.Sprite(gradientTexture);
            bgSprite.width = CARD_WIDTH;
            bgSprite.height = CARD_HEIGHT;
            cardContainer.addChild(bgSprite);

            const cardGraphics = new PIXI.Graphics();
            cardGraphics.beginFill(0x331111);
            cardGraphics.drawRect(0, 0, CARD_WIDTH, TITLE_BAR_HEIGHT);
            cardGraphics.lineStyle(1.5, 0xAA3333);
            cardGraphics.moveTo(0, TITLE_BAR_HEIGHT);
            cardGraphics.lineTo(CARD_WIDTH, TITLE_BAR_HEIGHT);
            cardGraphics.moveTo(0, TITLE_BAR_HEIGHT + IMAGE_HEIGHT);
            cardGraphics.lineTo(CARD_WIDTH, TITLE_BAR_HEIGHT + IMAGE_HEIGHT);
            cardGraphics.lineStyle(1.5, 0xFF3737);
            cardGraphics.drawRect(-0.75, -0.75, CARD_WIDTH + 1.5, CARD_HEIGHT + 1.5);
            cardContainer.addChild(cardGraphics);

            const placeholder = new PIXI.Graphics();
            placeholder.beginFill(0xf0f0f0);
            placeholder.drawRect(0, 0, CARD_WIDTH - 10, IMAGE_HEIGHT - 10);
            placeholder.position.set(5, TITLE_BAR_HEIGHT + 5);
            cardContainer.addChild(placeholder);

            const imageSprite = new PIXI.Sprite(PIXI.Texture.from(card.thumbnail_url));
            imageSprite.position.set(5, TITLE_BAR_HEIGHT + 5);
            imageSprite.width = CARD_WIDTH - 10;
            imageSprite.height = IMAGE_HEIGHT - 10;
            cardContainer.addChild(imageSprite);
            card.imageSprite = imageSprite;

            imageSprite.texture.baseTexture.once('loaded', () => {
                placeholder.visible = false;
            });

            const titleText = new PIXI.Text(card.title.toUpperCase(), {
                fontFamily: 'Jura',
                fontSize: 25,
                fill: 0x00DDDD,
                fontWeight: 'bold',
                anchor: { y: 0.5 }
            });
            titleText.position.set(10, 16);
            cardContainer.addChild(titleText);

            const theorySubText = new PIXI.Text(`${card.theory_name.toUpperCase()} - ${card.sub_theory_name.toUpperCase()}`, {
                fontFamily: 'Jura',
                fontSize: 16,
                fill: 0xFF5555,
                fontWeight: 'bold',
                anchor: { y: 0.5 }
            });
            theorySubText.position.set(10, 38);
            cardContainer.addChild(theorySubText);

            const sourceText = new PIXI.Text(card.source_name.toUpperCase(), {
                fontFamily: 'Jura',
                fontSize: 16,
                fill: 0xFF5555,
                fontWeight: 'bold',
                anchor: { y: 0.5 }
            });
            sourceText.position.set(10, 58);
            cardContainer.addChild(sourceText);

            const factText = new PIXI.Text(card.is_fact ? 'FACT' : 'OPINION', {
                fontFamily: 'Jura',
                fontSize: 16,
                fill: card.is_fact ? 0x00FF00 : 0xFFFF00,
                fontWeight: 'bold',
                anchor: { x: 1, y: 0.5 }
            });
            factText.position.set(CARD_WIDTH - 10, 58);
            cardContainer.addChild(factText);

            const descText = new PIXI.Text(card.description, {
                fontFamily: 'Jura',
                fontSize: 15,
                fill: 0xFF5555,
                fontWeight: 'bold',
                wordWrap: true,
                wordWrapWidth: CARD_WIDTH - 70
            });
            descText.position.set(8, TITLE_BAR_HEIGHT + IMAGE_HEIGHT + 7);
            cardContainer.addChild(descText);

            card.zoomSensitive = [titleText, theorySubText, sourceText, factText, descText];
        });
    }

    function updateGrid() {
        gridGraphics.clear();

        const w = app.screen.width;
        const h = app.screen.height;

        let spacing = BASE_GRID * scale;
        let step = 1;
        while (spacing * step < MIN_SPACING) step *= 2;
        spacing = BASE_GRID * step * scale;

        let startX = offsetX % spacing;
        if (startX < 0) startX += spacing;
        let startY = offsetY % spacing;
        if (startY < 0) startY += spacing;

        gridGraphics.lineStyle(1, 0x442222);
        for (let x = startX; x < w; x += spacing) {
            gridGraphics.moveTo(x, 0);
            gridGraphics.lineTo(x, h);
        }
        for (let y = startY; y < h; y += spacing) {
            gridGraphics.moveTo(0, y);
            gridGraphics.lineTo(w, y);
        }

        const majorSpacing = spacing * MAJOR_MULT;
        let majorStartX = offsetX % majorSpacing;
        if (majorStartX < 0) majorStartX += majorSpacing;
        let majorStartY = offsetY % majorSpacing;
        if (majorStartY < 0) majorStartY += majorSpacing;

        gridGraphics.lineStyle(1.5, 0x552222);
        for (let x = majorStartX; x < w; x += majorSpacing) {
            gridGraphics.moveTo(x, 0);
            gridGraphics.lineTo(x, h);
        }
        for (let y = majorStartY; y < h; y += majorSpacing) {
            gridGraphics.moveTo(0, y);
            gridGraphics.lineTo(w, y);
        }

        gridGraphics.lineStyle(2, 0x773333);
        gridGraphics.moveTo(0, offsetY);
        gridGraphics.lineTo(w, offsetY);
        gridGraphics.moveTo(offsetX, 0);
        gridGraphics.lineTo(offsetX, h);
    }

    function updateZoomAlphas() {
        const alpha = Math.min(1, (scale - 0.3) * 4);
        const zoomedEnough = scale > 0.3;

        json.cards.forEach(card => {
            card.zoomSensitive.forEach(text => {
                text.alpha = alpha;
            });
        });
    }

    function resize() {
        app.resize();
        updateGrid();
        updateZoomAlphas();
    }

    function addEventListeners() {
        window.addEventListener('resize', resize);

        document.getElementById('resetBtn').addEventListener('click', onReset);

        const canvas = app.view;
        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        canvas.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('mouseleave', onPointerUp);
        canvas.addEventListener('wheel', onMouseZoom, { passive: false });

        canvas.addEventListener('touchstart', onPointerDown, { passive: false });
        canvas.addEventListener('touchmove', onPointerMove, { passive: false });
        canvas.addEventListener('touchend', onPointerUp);
        canvas.addEventListener('touchcancel', onPointerUp);

        canvas.addEventListener('click', onImageClick);

        canvas.style.touchAction = 'none';

        closeModal.onclick = () => fullscreenModal.style.display = 'none';
        fullscreenModal.onclick = e => {
            if (e.target === fullscreenModal) fullscreenModal.style.display = 'none';
        };
    }

    function onReset() {
        offsetX = window.innerWidth / 2;
        offsetY = window.innerHeight / 2;
        scale = 0.05;
        mainContainer.position.set(offsetX, offsetY);
        mainContainer.scale.set(scale);
        json.cards.forEach(card => {
            card.x = card.initial_x;
            card.y = card.initial_y;
            card.container.position.set(card.x, card.y);
        });
        updateGrid();
        updateZoomAlphas();
    }

    function onPointerDown(e) {
        const pointers = e.touches ? e.touches : [e];
        const pointer = pointers[0];
        const mx = pointer.clientX;
        const my = pointer.clientY;

        if (e.touches && e.touches.length >= 2) {
            prevPinchDist = 0;
            return;
        }

        for (const card of json.cards) {
            const sx = w2sX(card.x);
            const sy = w2sY(card.y);
            const sw = w2sL(CARD_WIDTH);
            const titleH = w2sL(TITLE_BAR_HEIGHT);

            if (mx >= sx && mx <= sx + sw && my >= sy && my <= sy + titleH) {
                draggedCard = card;
                dragOffX = mx - sx;
                dragOffY = my - sy;
                app.view.style.cursor = 'grabbing';
                return;
            }
        }

        isDraggingCanvas = true;
        lastMX = mx;
        lastMY = my;
    }

    function onPointerMove(e) {
        e.preventDefault();

        if (e.touches && e.touches.length >= 2) {
            const t1 = e.touches[0];
            const t2 = e.touches[1];
            const currDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
            const centerX = (t1.clientX + t2.clientX) / 2;
            const centerY = (t1.clientY + t2.clientY) / 2;

            if (prevPinchDist > 0) {
                const factor = currDist / prevPinchDist;

                const wx = (centerX - offsetX) / scale;
                const wy = (centerY - offsetY) / scale;

                scale *= factor;
                scale = Math.max(0.05, Math.min(scale, 5));

                offsetX = centerX - wx * scale;
                offsetY = centerY - wy * scale;

                mainContainer.position.set(offsetX, offsetY);
                mainContainer.scale.set(scale);

                updateGrid();
                updateZoomAlphas();
            }

            prevPinchDist = currDist;
        } else {
            const pointers = e.touches ? e.touches : [e];
            if (pointers.length === 0) return;
            const pointer = pointers[0];
            const mx = pointer.clientX;
            const my = pointer.clientY;

            if (draggedCard) {
                draggedCard.x = (mx - dragOffX - offsetX) / scale;
                draggedCard.y = (my - dragOffY - offsetY) / scale;
                draggedCard.container.position.set(draggedCard.x, draggedCard.y);
            } else if (isDraggingCanvas) {
                offsetX += mx - lastMX;
                offsetY += my - lastMY;
                lastMX = mx;
                lastMY = my;
                mainContainer.position.set(offsetX, offsetY);
                updateGrid();
                updateZoomAlphas();
            }
        }
    }

    function onPointerUp(e) {
        draggedCard = null;
        isDraggingCanvas = false;
        prevPinchDist = 0;
        app.view.style.cursor = 'initial';
    }

    function onMouseZoom(e) {
        e.preventDefault();
        const factor = Math.exp(-e.deltaY * 0.0015);
        const mx = e.clientX;
        const my = e.clientY;

        const wx = (mx - offsetX) / scale;
        const wy = (my - offsetY) / scale;

        scale *= factor;
        scale = Math.max(0.05, Math.min(scale, 5));

        offsetX = mx - wx * scale;
        offsetY = my - wy * scale;

        mainContainer.position.set(offsetX, offsetY);
        mainContainer.scale.set(scale);

        updateGrid();
        updateZoomAlphas();
    }

    function onImageClick(e) {
        if (draggedCard || isDraggingCanvas) {
            draggedCard = null;
            isDraggingCanvas = false;
            return;
        }

        const mx = e.clientX;
        const my = e.clientY;

        for (const card of json.cards) {
            const sx = w2sX(card.x);
            const sy = w2sY(card.y + TITLE_BAR_HEIGHT);
            const sw = w2sL(CARD_WIDTH);
            const sh = w2sL(IMAGE_HEIGHT);

            if (mx >= sx && mx <= sx + sw && my >= sy && my <= sy + sh) {
                fullscreenImage.src = card.image_url;
                fullscreenModal.style.display = 'flex';
                return;
            }
        }
    }

    initialize();
</script></body>
</html>
