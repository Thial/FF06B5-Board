<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF06B5 Board</title>
    <style>
        @import url(https://fonts.googleapis.com/css?family=Jura);

        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #322, #223);
            font-family: 'Jura';
	    cursor: initial;
        }
        canvas {
            display: block;
	    cursor: initial;
        }

        #controls {
            position: absolute;
            top: 50px;
            left: 10px;
            z-index: 100;
        }
        #resetBtn {
            background: white;
            border: 1px solid #ccc;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Jura';
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        #resetBtn:hover { background: #f8f8f8; }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,0.8);
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 5px;
            pointer-events: none;
            z-index: 100;
        }

        #fullscreenModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.95);
            z-index: 200;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        #fullscreenImage {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }
        #closeModal {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="info">Drag canvas to pan • Scroll to zoom • Drag card headers • Click images to enlarge</div>
    <div id="controls">
        <button id="resetBtn">Reset</button>
    </div>

    <div id="fullscreenModal">
        <div id="closeModal">×</div>
        <img id="fullscreenImage" src="" alt="Fullscreen">
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fullscreenModal = document.getElementById('fullscreenModal');
        const fullscreenImage = document.getElementById('fullscreenImage');
        const closeModal = document.getElementById('closeModal');

        const images = {};
        const theories = {};
        const sources = {};
        const cardsByTheory = [];

        let offsetX = window.innerWidth/2;
        let offsetY = window.innerHeight/2;
        let scale = 0.05;
        let prevPinchDist = 0;
        let draggedCard = null;
        let dragOffX = offsetX,
            dragOffY = offsetY;
        let isDraggingCanvas = false;
        let lastMX = 0,
            lastMY = 0;

        const BASE_GRID = 80;
        const MIN_SPACING = 40;
        const MAJOR_MULT = 4;

        const CARD_HEADER_HEIGHT = 70;
        const CARD_IMAGE_HEIGHT = 400;
        const CARD_TEXT_HEIGHT = 230;
        const CARD_WIDTH = 400;
        const CARD_HEIGHT = CARD_HEADER_HEIGHT + CARD_IMAGE_HEIGHT + CARD_TEXT_HEIGHT;
        const CARD_GAP_X = CARD_WIDTH + 350;
        const CARD_GAP_Y = CARD_HEIGHT + 100;

        const CARD_GENERATE_SCALE = 1;
        const CARD_GENERATE_HEADER_HEIGHT = CARD_HEADER_HEIGHT * CARD_GENERATE_SCALE;
        const CARD_GENERATE_IMAGE_HEIGHT = CARD_IMAGE_HEIGHT * CARD_GENERATE_SCALE;
        const CARD_GENERATE_TEXT_HEIGHT = CARD_TEXT_HEIGHT * CARD_GENERATE_SCALE;
        const CARD_GENERATE_WIDTH = CARD_WIDTH * CARD_GENERATE_SCALE;
        const CARD_GENERATE_HEIGHT = CARD_HEIGHT * CARD_GENERATE_SCALE;

        let needsDraw = true;

        let json;

        let theoryWidth = 0;
        let theoryHeight = 0;

        function w2sX(x) {
            return x * scale + offsetX;
        }

        function w2sY(y) {
            return y * scale + offsetY;
        }

        function w2sL(l) {
            return l * scale;
        }

        async function initialize() {
            fetch('data.json')
                .then(response => {
                    if (!response.ok) throw new Error('Failed to get data!');
                    return response.json();
                })
                .then(data => {
                    json = data;
                    console.log(json);
                    initializeCollections();
                    calculateTheoryPositions();
                    calculateCardPositions();
                    addEventListeners();

                    json.cards.forEach(card => {
                        const img = new Image();
                        img.src = card.thumbnail_url;
                        img.onload = () => {
                            generateCard(card);
                            needsDraw = true;
                            draw();
                        };
                        images[card.thumbnail_url] = img;
                    });

                    draw();
                })
                .catch(err => console.error(err));
        }


        function initializeCollections() {
            json.theories.forEach(theory => {
                theories[theory.id] = theory;
                cardsByTheory[theory.id] = [];
            });

            json.sources.forEach(source => {
                sources[source.id] = source;
            });

            json.cards.forEach(card => {
                cardsByTheory[card.theory_id].push(card);
                card.canvas = document.createElement('canvas');
                card.canvas.width = CARD_GENERATE_WIDTH;
                card.canvas.height = CARD_GENERATE_HEIGHT;
            });

            json.theories.forEach(theory => {
                let theoryCardCount = cardsByTheory[theory.id].length;
                let cardGridSize = Math.max(2, Math.ceil(Math.sqrt(theoryCardCount)));
                theory.card_grid_size = cardGridSize;
            });
        }

        function calculateTheoryPositions() {
            const theoryGridSize = Math.max(2, Math.ceil(Math.sqrt(json.theories.length)));
            const cardGridSizeMax = Math.max(...json.theories.map(theory => theory.card_grid_size));
            theoryWidth = cardGridSizeMax * CARD_GAP_X;
            theoryHeight = cardGridSizeMax * CARD_GAP_Y;
            const theoryGapSizeX = theoryWidth + 3 * CARD_GAP_X;
            const theoryGapSizeY = theoryHeight + 2 * CARD_GAP_Y;
            const theorySpanMaxX = theoryGridSize * theoryGapSizeX;
            const theorySpanMaxY = theoryGridSize * theoryGapSizeY;
            const theoryStartPointX = 0 - (theorySpanMaxX / 2) + (theorySpanMaxX / 8);
            const theoryStartPointY = 0 - (theorySpanMaxY / 2) + (theorySpanMaxY / 8);

            let theoryGridX = 0;
            let theoryGridY = 0;
            json.theories.forEach(theory => {
                theory.x = theoryStartPointX + theoryGridX * theoryGapSizeX;
                theory.y = theoryStartPointY + theoryGridY * theoryGapSizeY;
                theoryGridX++;
                if (theoryGridX >= theoryGridSize) {
                    theoryGridX = 0;
                    theoryGridY++;
                }
            });
        }

        function calculateCardPositions() {
            cardsByTheory.forEach(cards => {
                if (cards.length > 0) {
                    let theory = theories[cards[0].theory_id];
                    let cardGridX = 0;
                    let cardGridY = 0;
                    cards.forEach(card => {
                        card.initial_x = theory.x + (cardGridX * CARD_GAP_X);
                        card.initial_y = theory.y + (cardGridY * CARD_GAP_Y);
                        card.x = card.initial_x;
                        card.y = card.initial_y;
                        cardGridX++;
                        if (cardGridX >= theory.card_grid_size) {
                            cardGridX = 0;
                            cardGridY++;
                        }
                    });
                }
            });
        }

        function gs(value) {
            return value * CARD_GENERATE_SCALE;
        }

        function generateCard(card) {
            const cardCtx = card.canvas.getContext('2d', { alpha: true });

            const x = 0;
            const y = 0;
            const w = CARD_GENERATE_WIDTH;
            const h = CARD_GENERATE_HEIGHT;
            const title_bar_height = CARD_GENERATE_HEADER_HEIGHT;
            const image_height = CARD_GENERATE_IMAGE_HEIGHT;
            const text_height = CARD_GENERATE_TEXT_HEIGHT;

            // Off-screen culling
            if (x + w < 0 || x > canvas.width || y + h < 0 || y > canvas.height) return;

            // Card background
            const gradient = cardCtx.createLinearGradient(x, y, x, y + h);
            gradient.addColorStop(0, '#331111');
            gradient.addColorStop(1, '#191111');
            cardCtx.fillStyle = gradient;
            cardCtx.fillRect(x, y, w, h);

            // Title bar
            cardCtx.fillStyle = '#311';
            cardCtx.fillRect(x, y, w, title_bar_height);

            // Title
            //cardCtx.save();
            //cardCtx.globalCompositeOperation = 'lighter';
            cardCtx.fillStyle = '#0DD';
            //cardCtx.shadowColor = '#0DD';
            cardCtx.font = `bold ${gs(25)}px Jura, sans-serif`;
            cardCtx.textBaseline = 'middle';
            cardCtx.textAlign = 'left';
            //cardCtx.shadowBlur = 10;
            cardCtx.fillText(card.title.toUpperCase(), x + gs(10), y + gs(20));
            //cardCtx.restore();

            // Theory
            cardCtx.fillStyle = '#F55';
            cardCtx.font = `bold ${gs(16)}px Jura, sans-serif`;
            cardCtx.textBaseline = 'middle';
            cardCtx.textAlign = 'left';
            cardCtx.fillText(`${theories[card.theory_id].name.toUpperCase()} - ${sources[card.source_id].name.toUpperCase()}`, x + gs(10), y + gs(50));

            let factCheckX = x + w - (card.is_fact ? gs(65) : gs(92));
            let factCheckY = y + gs(38);
            let factCheckW = (card.is_fact ? gs(56) : gs(83));
            let factCheckH = gs(25);

            // FactCheck Square
            cardCtx.fillStyle = (card.is_fact ? '#040' : '#440');
            cardCtx.fillRect(factCheckX, factCheckY, factCheckW, factCheckH);

            // Fact Check Border
            //cardCtx.save();
            //cardCtx.globalCompositeOperation = 'lighter';
            //cardCtx.shadowColor = (card.is_fact ? '#0F0' : '#FF0');
            if (card.is_fact) {
              cardCtx.strokeStyle = `rgba(0, 255, 0, 1)`;
            } else {
              cardCtx.strokeStyle = `rgba(255, 255, 0, 1)`;
            }
            //cardCtx.shadowBlur = 10;
            cardCtx.lineWidth = gs(1.5);
            cardCtx.strokeRect(factCheckX, factCheckY, factCheckW, factCheckH);
            //cardCtx.restore();

            // FactCheck
            cardCtx.font = `bold ${gs(16)}px Jura, sans-serif`;
            cardCtx.textAlign = 'right';
            cardCtx.textBaseline = 'middle';
            cardCtx.fillStyle = (card.is_fact ? '#0F0' : '#FF0');
            let factCheckText = (card.is_fact ? 'FACT' : 'OPINION');
            cardCtx.fillText(factCheckText, x + w - gs(18), y + gs(50));

            // Line
            //cardCtx.save();
            //cardCtx.globalCompositeOperation = 'lighter';
            cardCtx.fillStyle = '#AA3333';
            //cardCtx.shadowColor = '#AA3333';
            //cardCtx.shadowBlur = 10;
            cardCtx.fillRect(x, y + title_bar_height, w, gs(2));
            //cardCtx.restore();

            // Image placeholder or real image
            const img = images[card.thumbnail_url];
            if (img && img.complete) {
                cardCtx.drawImage(img, x + gs(5), y + title_bar_height + gs(5), w - gs(10), image_height - gs(10));
            } else {
                cardCtx.fillStyle = '#f0f0f0';
                cardCtx.fillRect(x, y + title_bar_height, w, image_height);
            }

            // Line
            //cardCtx.save();
            //cardCtx.globalCompositeOperation = 'lighter';
            cardCtx.fillStyle = '#AA3333';
            //cardCtx.shadowColor = '#AA3333';
            //cardCtx.shadowBlur = 10;
            cardCtx.fillRect(x, y + title_bar_height + image_height - 2, w, gs(2));
            //cardCtx.restore();

            // Description text
            cardCtx.fillStyle = '#F55';
            cardCtx.font = `bold ${gs(16)}px Jura, sans-serif`;
            cardCtx.textAlign = 'left';
            cardCtx.textBaseline = 'middle';
            const maxWidth = w - gs(32);
            const lineHeight = gs(17);
            let curY = y + title_bar_height + image_height + gs(13);

            const words = card.description.split(' ');
            let line = '';
            for (const word of words) {
                const testLine = line + word + ' ';
                const metrics = cardCtx.measureText(testLine);
                if (metrics.width > maxWidth && line !== '') {
                    cardCtx.fillText(line, x + gs(10), curY);
                    line = word + ' ';
                    curY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            if (line) cardCtx.fillText(line, x + gs(10), curY);

            //cardCtx.save()

            //cardCtx.globalCompositeOperation = 'lighter';

            //cardCtx.shadowColor = '#ff5555';
            cardCtx.strokeStyle = `rgba(255, 55, 55, 1)`;
            //cardCtx.shadowBlur = 20;
            cardCtx.lineWidth = gs(1.5);
            cardCtx.strokeRect(x + gs(0.75), y + gs(0.75), w - gs(1.5), h - gs(1.5));

            //cardCtx.restore();
        }

        function drawGrid() {
            const w = canvas.width;
            const h = canvas.height;

            let spacing = BASE_GRID * scale;
            let step = 1;
            while (spacing * step < MIN_SPACING) step *= 2;
            spacing = BASE_GRID * step * scale;

            let startX = offsetX % spacing;
            if (startX < 0) startX += spacing;
            let startY = offsetY % spacing;
            if (startY < 0) startY += spacing;

            ctx.strokeStyle = '#422';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = startX; x < w; x += spacing) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
            }
            for (let y = startY; y < h; y += spacing) {
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
            }
            ctx.stroke();

            const majorSpacing = spacing * MAJOR_MULT;
            let majorStartX = offsetX % majorSpacing;
            if (majorStartX < 0) majorStartX += majorSpacing;
            let majorStartY = offsetY % majorSpacing;
            if (majorStartY < 0) majorStartY += majorSpacing;

            ctx.strokeStyle = '#522';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let x = majorStartX; x < w; x += majorSpacing) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
            }
            for (let y = majorStartY; y < h; y += majorSpacing) {
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
            }
            ctx.stroke();

            ctx.strokeStyle = '#733';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, offsetY);
            ctx.lineTo(w, offsetY);
            ctx.moveTo(offsetX, 0);
            ctx.lineTo(offsetX, h);
            ctx.stroke();
        }

        function drawTheory(theory) {
            const x = w2sX(theory.x);
            const y = w2sY(theory.y - 400);
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            ctx.fillStyle = '#733';
            ctx.font = `bold ${w2sL(400)}px Jura, sans-serif`;
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            ctx.fillText(theory.name.toUpperCase(), x + w2sL(theoryWidth / 2 - 150), y);
            ctx.restore();
        }

        function drawCard(card) {
            const x = w2sX(card.x);
            const y = w2sY(card.y);
            const w = w2sL(CARD_WIDTH);
            const h = w2sL(CARD_HEIGHT);
            if (x + w < 0 || x > canvas.width || y + h < 0 || y > canvas.height) return;

            ctx.drawImage(card.canvas, 0, 0, CARD_GENERATE_WIDTH, CARD_GENERATE_HEIGHT, x , y , w, h);
        }

        function draw() {
            if (!needsDraw) return;
            needsDraw = false;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();

            [...json.theories].forEach(drawTheory);
            [...json.cards].sort((a, b) => a.y - b.y).forEach(drawCard);
        }


        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            needsDraw = true;
            draw();
        }

        function addEventListeners() {
            window.addEventListener('resize', resize);
            resize();

            document.getElementById('resetBtn').addEventListener('click', onReset);

            // Mouse events
            canvas.addEventListener('mousedown', onPointerDown);
            canvas.addEventListener('mousemove', onPointerMove);
            canvas.addEventListener('mouseup', onPointerUp);
            canvas.addEventListener('mouseleave', onPointerUp);
            canvas.addEventListener('wheel', onMouseZoom, { passive: false });

            // Touch events
            canvas.addEventListener('touchstart', onPointerDown, { passive: false });
            canvas.addEventListener('touchmove', onPointerMove, { passive: false });
            canvas.addEventListener('touchend', onPointerUp);
            canvas.addEventListener('touchcancel', onPointerUp);

            // Click for opening fullscreen image
            canvas.addEventListener('click', onImageClick);

            // Prevent browser gestures (page zoom, scroll, context menu)
            canvas.style.touchAction = 'none';

            // Modal close
            closeModal.onclick = () => fullscreenModal.style.display = 'none';
            fullscreenModal.onclick = e => {
                if (e.target === fullscreenModal) fullscreenModal.style.display = 'none';
            };
        }

        function onReset() {
            offsetX = window.innerWidth / 2;
            offsetY = window.innerHeight / 2;
            scale = 0.05;
            json.cards.forEach(card => {
                card.x = card.initial_x;
                card.y = card.initial_y;
            });
            needsDraw = true;
            draw();
        }

        function onPointerDown(e) {
            const pointers = e.touches ? e.touches : [e];
            const pointer = pointers[0];
            const mx = pointer.clientX;
            const my = pointer.clientY;

            // If two fingers down → prepare for pinch, don't start dragging
            if (e.touches && e.touches.length >= 2) {
                prevPinchDist = 0;
                return;
            }

            // Check for card title bar grab
            for (const card of json.cards) {
                const sx = w2sX(card.x);
                const sy = w2sY(card.y);
                const sw = w2sL(CARD_WIDTH);
                const titleH = w2sL(CARD_HEADER_HEIGHT);

                if (mx >= sx && mx <= sx + sw && my >= sy && my <= sy + titleH) {
                    draggedCard = card;
                    dragOffX = mx - sx;
                    dragOffY = my - sy;
                    canvas.style.cursor = 'grabbing';
                    return;
                }
            }

            // Otherwise: pan the canvas
            isDraggingCanvas = true;
            lastMX = mx;
            lastMY = my;
        }

        function onPointerMove(e) {
            e.preventDefault(); // Very important for touch

            // === Pinch Zoom (two fingers) ===
            if (e.touches && e.touches.length >= 2) {
                const t1 = e.touches[0];
                const t2 = e.touches[1];
                const currDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                const centerX = (t1.clientX + t2.clientX) / 2;
                const centerY = (t1.clientY + t2.clientY) / 2;

                if (prevPinchDist > 0) {
                    const factor = currDist / prevPinchDist;

                    const wx = (centerX - offsetX) / scale;
                    const wy = (centerY - offsetY) / scale;

                    scale *= factor;
                    scale = Math.max(0.05, Math.min(scale, 5));

                    offsetX = centerX - wx * scale;
                    offsetY = centerY - wy * scale;

                    needsDraw = true;
                }

                prevPinchDist = currDist;
            }
            // === Single pointer (mouse or one finger) ===
            else {
                const pointers = e.touches ? e.touches : [e];
                if (pointers.length === 0) return;
                const pointer = pointers[0];
                const mx = pointer.clientX;
                const my = pointer.clientY;

                if (draggedCard) {
                    draggedCard.x = (mx - dragOffX - offsetX) / scale;
                    draggedCard.y = (my - dragOffY - offsetY) / scale;
                    needsDraw = true;
                } else if (isDraggingCanvas) {
                    offsetX += mx - lastMX;
                    offsetY += my - lastMY;
                    lastMX = mx;
                    lastMY = my;
                    needsDraw = true;
                }
            }

            // Trigger continuous redraw during movement
            if (needsDraw) {
                requestAnimationFrame(draw);
                // Do NOT set needsDraw = false here — we want it to keep drawing every frame
                // Your draw() function should reset it when done, or just rely on RAF
            }
        }

        function onPointerUp(e) {
            draggedCard = null;
            isDraggingCanvas = false;
            prevPinchDist = 0;
            canvas.style.cursor = 'initial';

            needsDraw = true;
            draw();
        }

        function onMouseZoom(e) {
            e.preventDefault();
            const factor = Math.exp(-e.deltaY * 0.0015);
            const mx = e.clientX;
            const my = e.clientY;

            const wx = (mx - offsetX) / scale;
            const wy = (my - offsetY) / scale;

            scale *= factor;
            scale = Math.max(0.05, Math.min(scale, 5));

            offsetX = mx - wx * scale;
            offsetY = my - wy * scale;

            needsDraw = true;
            draw();
        }

        function onImageClick(e) {
            // If we just finished dragging, ignore the click
            if (draggedCard || isDraggingCanvas) {
                draggedCard = null;
                isDraggingCanvas = false;
                return;
            }

            const mx = e.clientX;
            const my = e.clientY;

            for (const card of json.cards) {
                const sx = w2sX(card.x);
                const sy = w2sY(card.y + CARD_HEADER_HEIGHT);
                const sw = w2sL(CARD_WIDTH);
                const sh = w2sL(CARD_IMAGE_HEIGHT);

                if (mx >= sx && mx <= sx + sw && my >= sy && my <= sy + sh) {
                    fullscreenImage.src = card.image_url;
                    fullscreenModal.style.display = 'flex';
                    return;
                }
            }
        }

        initialize();
    </script>
</body>
</html>
