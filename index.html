<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF06B5 Board</title>
    <style>
        @import url(https://fonts.googleapis.com/css?family=Jura);

        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #322, #223);
            font-family: 'Jura';
	    cursor: initial;
        }
        canvas {
            display: block;
	    cursor: initial;
        }

        #controls {
            position: absolute;
            top: 50px;
            left: 10px;
            z-index: 100;
        }
        #resetBtn {
            background: white;
            border: 1px solid #ccc;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Jura';
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        #resetBtn:hover { background: #f8f8f8; }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,0.8);
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 5px;
            pointer-events: none;
            z-index: 100;
        }

        #fullscreenModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.95);
            z-index: 200;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        #fullscreenImage {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }
        #closeModal {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="info">Drag canvas to pan • Scroll to zoom • Drag card headers • Click images to enlarge</div>
    <div id="controls">
        <button id="resetBtn">Reset</button>
    </div>

    <div id="fullscreenModal">
        <div id="closeModal">×</div>
        <img id="fullscreenImage" src="" alt="Fullscreen">
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fullscreenModal = document.getElementById('fullscreenModal');
        const fullscreenImage = document.getElementById('fullscreenImage');
        const closeModal = document.getElementById('closeModal');

        const images = {};
        const theories = {};
        const sources = {};
        const cardsByTheory = [];

        let offsetX = window.innerWidth/2;
        let offsetY = window.innerHeight/2;
        let scale = 0.05;

        let draggedCard = null;
        let dragOffX = offsetX,
            dragOffY = offsetY;
        let isDraggingCanvas = false;
        let lastMX = 0,
            lastMY = 0;

        const BASE_GRID = 80;
        const MIN_SPACING = 40;
        const MAJOR_MULT = 4;

        const TITLE_BAR_HEIGHT = 70;
        const IMAGE_HEIGHT = 400;
        const TEXT_HEIGHT = 230;
        const CARD_WIDTH = 400;
        const CARD_HEIGHT = TITLE_BAR_HEIGHT + IMAGE_HEIGHT + TEXT_HEIGHT;
        const CARD_GAP_X = CARD_WIDTH + 350;
        const CARD_GAP_Y = CARD_HEIGHT + 100;

        let needsDraw = true;

        let json;

        let theoryWidth = 0;
        let theoryHeight = 0;

        function w2sX(x) {
            return x * scale + offsetX;
        }

        function w2sY(y) {
            return y * scale + offsetY;
        }

        function w2sL(l) {
            return l * scale;
        }

        async function initialize() {
            fetch('data.json')
                .then(response => {
                    if (!response.ok) throw new Error('Failed to get data!');
                    return response.json();
                })
                .then(data => {
                    json = data;
                    console.log(json);
                    initializeCollections();
                    calculateTheoryPositions();
                    calculateCardPositions();
                    addEventListeners();

                    json.cards.forEach(card => {
                        const img = new Image();
                        img.src = card.thumbnail_url;
                        img.onload = () => {
                            needsDraw = true;
                            draw();
                        };
                        images[card.thumbnail_url] = img;
                    });

                    draw();
                })
                .catch(err => console.error(err));
        }


        function initializeCollections() {
            json.theories.forEach(theory => {
                theories[theory.id] = theory;
                cardsByTheory[theory.id] = [];
            });

            json.sources.forEach(source => {
                sources[source.id] = source;
            });

            json.cards.forEach(card => {
                cardsByTheory[card.theory_id].push(card);
            });

            json.theories.forEach(theory => {
                let theoryCardCount = cardsByTheory[theory.id].length;
                let cardGridSize = Math.max(2, Math.ceil(Math.sqrt(theoryCardCount)));
                theory.card_grid_size = cardGridSize;
            });
        }

        function calculateTheoryPositions() {
            const theoryGridSize = Math.max(2, Math.ceil(Math.sqrt(json.theories.length)));
            const cardGridSizeMax = Math.max(...json.theories.map(theory => theory.card_grid_size));
            theoryWidth = cardGridSizeMax * CARD_GAP_X;
            theoryHeight = cardGridSizeMax * CARD_GAP_Y;
            const theoryGapSizeX = theoryWidth + 3 * CARD_GAP_X;
            const theoryGapSizeY = theoryHeight + 2 * CARD_GAP_Y;
            const theorySpanMaxX = theoryGridSize * theoryGapSizeX;
            const theorySpanMaxY = theoryGridSize * theoryGapSizeY;
            const theoryStartPointX = 0 - (theorySpanMaxX / 2) + (theorySpanMaxX / 8);
            const theoryStartPointY = 0 - (theorySpanMaxY / 2) + (theorySpanMaxY / 8);

            let theoryGridX = 0;
            let theoryGridY = 0;
            json.theories.forEach(theory => {
                theory.x = theoryStartPointX + theoryGridX * theoryGapSizeX;
                theory.y = theoryStartPointY + theoryGridY * theoryGapSizeY;
                theoryGridX++;
                if (theoryGridX >= theoryGridSize) {
                    theoryGridX = 0;
                    theoryGridY++;
                }
            });
        }

        function calculateCardPositions() {
            cardsByTheory.forEach(cards => {
                if (cards.length > 0) {
                    let theory = theories[cards[0].theory_id];
                    let cardGridX = 0;
                    let cardGridY = 0;
                    cards.forEach(card => {
                        card.initial_x = theory.x + (cardGridX * CARD_GAP_X);
                        card.initial_y = theory.y + (cardGridY * CARD_GAP_Y);
                        card.x = card.initial_x;
                        card.y = card.initial_y;
                        cardGridX++;
                        if (cardGridX >= theory.card_grid_size) {
                            cardGridX = 0;
                            cardGridY++;
                        }
                    });
                }
            });
        }

        function drawGrid() {
            const w = canvas.width;
            const h = canvas.height;

            let spacing = BASE_GRID * scale;
            let step = 1;
            while (spacing * step < MIN_SPACING) step *= 2;
            spacing = BASE_GRID * step * scale;

            let startX = offsetX % spacing;
            if (startX < 0) startX += spacing;
            let startY = offsetY % spacing;
            if (startY < 0) startY += spacing;

            ctx.strokeStyle = '#422';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = startX; x < w; x += spacing) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
            }
            for (let y = startY; y < h; y += spacing) {
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
            }
            ctx.stroke();

            const majorSpacing = spacing * MAJOR_MULT;
            let majorStartX = offsetX % majorSpacing;
            if (majorStartX < 0) majorStartX += majorSpacing;
            let majorStartY = offsetY % majorSpacing;
            if (majorStartY < 0) majorStartY += majorSpacing;

            ctx.strokeStyle = '#522';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let x = majorStartX; x < w; x += majorSpacing) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
            }
            for (let y = majorStartY; y < h; y += majorSpacing) {
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
            }
            ctx.stroke();

            ctx.strokeStyle = '#733';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, offsetY);
            ctx.lineTo(w, offsetY);
            ctx.moveTo(offsetX, 0);
            ctx.lineTo(offsetX, h);
            ctx.stroke();
        }

        function drawTheory(theory) {
            const x = w2sX(theory.x);
            const y = w2sY(theory.y - 400);
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            ctx.fillStyle = '#733';
            ctx.font = `bold ${w2sL(400)}px Jura, sans-serif`;
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            ctx.fillText(theory.name.toUpperCase(), x + w2sL(theoryWidth / 2 - 150), y);
            ctx.restore();
        }

        function drawCard(card) {
            const x = w2sX(card.x);
            const y = w2sY(card.y);
            const w = w2sL(CARD_WIDTH);
            const h = w2sL(CARD_HEIGHT);
            const title_bar_height = w2sL(TITLE_BAR_HEIGHT);
            const image_height = w2sL(IMAGE_HEIGHT);
            const text_height = w2sL(TEXT_HEIGHT);
            let blur = w2sL(10);

            // Off-screen culling
            if (x + w < 0 || x > canvas.width || y + h < 0 || y > canvas.height) return;

            // Card background
            const gradient = ctx.createLinearGradient(x, y, x, y + h);
            gradient.addColorStop(0, '#331111');
            gradient.addColorStop(1, '#191111');
            ctx.fillStyle = gradient;
            ctx.fillRect(x, y, w, h);

            // Title bar
            ctx.fillStyle = '#311';
            ctx.fillRect(x, y, w, title_bar_height);

            // Title
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = '#0DD';
            ctx.shadowColor = '#0DD';
            ctx.font = `bold ${w2sL(25)}px Jura, sans-serif`;
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'left';
            ctx.shadowBlur = (blur > 4 ? blur : 0);
            ctx.fillText(card.title.toUpperCase(), x + w2sL(10), y + w2sL(20));
            ctx.restore();

            // Theory
            ctx.fillStyle = '#F55';
            ctx.font = `bold ${w2sL(16)}px Jura, sans-serif`;
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'left';
            ctx.fillText(`${theories[card.theory_id].name.toUpperCase()} - ${sources[card.source_id].name.toUpperCase()}`, x + w2sL(10), y + w2sL(50));

            let factCheckX = x + w - (card.is_fact ? w2sL(65) : w2sL(92));
            let factCheckY = y + w2sL(38);
            let factCheckW = (card.is_fact ? w2sL(56) : w2sL(83));
            let factCheckH = w2sL(25);

            // FactCheck Square
            ctx.fillStyle = (card.is_fact ? '#040' : '#440');
            ctx.fillRect(factCheckX, factCheckY, factCheckW, factCheckH);

            // Fact Check Border
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.shadowColor = (card.is_fact ? '#0F0' : '#FF0');
            if (card.is_fact) {
              ctx.strokeStyle = `rgba(0, 255, 0, 1)`;
            } else {
              ctx.strokeStyle = `rgba(255, 255, 0, 1)`;
            }
            ctx.shadowBlur = (blur > 4 ? blur : 0);
            ctx.lineWidth = w2sL(1.5);
            ctx.strokeRect(factCheckX, factCheckY, factCheckW, factCheckH);
            ctx.restore();

            // FactCheck
            ctx.font = `bold ${w2sL(16)}px Jura, sans-serif`;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = (card.is_fact ? '#0F0' : '#FF0');
            let factCheckText = (card.is_fact ? 'FACT' : 'OPINION');
            ctx.fillText(factCheckText, x + w - w2sL(18), y + w2sL(50));

            // Line
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = '#AA3333';
            ctx.shadowColor = '#AA3333';
            ctx.shadowBlur = (blur > 4 ? blur : 0);
            ctx.fillRect(x, y + title_bar_height, w, w2sL(1.5));
            ctx.restore();

            // Image placeholder or real image
            const img = images[card.thumbnail_url];
            if (img && img.complete) {
                ctx.drawImage(img, x + w2sL(5), y + title_bar_height + w2sL(5), w - w2sL(10), image_height - w2sL(10));
            } else {
                ctx.fillStyle = '#f0f0f0';
                ctx.fillRect(x, y + title_bar_height, w, image_height);
            }

            // Line
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = '#AA3333';
            ctx.shadowColor = '#AA3333';
            ctx.shadowBlur = (blur > 4 ? blur : 0);
            ctx.fillRect(x, y + title_bar_height + image_height, w, w2sL(1.5));
            ctx.restore();

            // Description text
            ctx.fillStyle = '#F55';
            ctx.font = `bold ${w2sL(15)}px Jura, sans-serif`;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            const maxWidth = w - w2sL(32);
            const lineHeight = w2sL(22);
            let curY = y + title_bar_height + image_height + w2sL(12);

            const words = card.description.split(' ');
            let line = '';
            for (const word of words) {
                const testLine = line + word + ' ';
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && line !== '') {
                    ctx.fillText(line, x + w2sL(16), curY);
                    line = word + ' ';
                    curY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            if (line) ctx.fillText(line, x + w2sL(16), curY);

            ctx.save()

            ctx.globalCompositeOperation = 'lighter';

            ctx.shadowColor = '#ff5555';
            ctx.strokeStyle = `rgba(255, 55, 55, 1)`;
            ctx.shadowBlur = (blur > 4 ? blur : 0);
            ctx.lineWidth = w2sL(1.5);
            ctx.strokeRect(x - w2sL(0.75), y - w2sL(0.75), w + w2sL(1.5), h + w2sL(1.5));

            ctx.restore();
        }

        function draw() {
            if (!needsDraw) return;
            needsDraw = false;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();

            [...json.theories].forEach(drawTheory);
            [...json.cards].sort((a, b) => a.y - b.y).forEach(drawCard);
        }


        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            needsDraw = true;
            draw();
        }

        function addEventListeners() {
            window.addEventListener('resize', resize);
            resize();

            document.getElementById('resetBtn').addEventListener('click', () => {
                offsetX = window.innerWidth/2;
                offsetY = window.innerHeight/2;
                scale = 0.05;
                json.cards.forEach(card => {
                  card.x = card.initial_x;
                  card.y = card.initial_y;
                });
                needsDraw = true;
                draw();
            });

            canvas.addEventListener('mousedown', e => {
                const mx = e.clientX;
                const my = e.clientY;

                for (const card of json.cards) {
                    const sx = w2sX(card.x);
                    const sy = w2sY(card.y);
                    const sw = w2sL(CARD_WIDTH);
                    const titleH = w2sL(TITLE_BAR_HEIGHT);

                    if (mx >= sx && mx <= sx + sw && my >= sy && my <= sy + titleH) {
                        draggedCard = card;
                        dragOffX = mx - sx;
                        dragOffY = my - sy;
                        canvas.style.cursor = 'grabbing';
                        return;
                    }
                }

                isDraggingCanvas = true;
                lastMX = mx;
                lastMY = my;
            });

            canvas.addEventListener('mousemove', e => {
                const mx = e.clientX;
                const my = e.clientY;

                if (draggedCard) {
                    draggedCard.x = (mx - dragOffX - offsetX) / scale;
                    draggedCard.y = (my - dragOffY - offsetY) / scale;
                    needsDraw = true;
                } else if (isDraggingCanvas) {
                    offsetX += mx - lastMX;
                    offsetY += my - lastMY;
                    lastMX = mx;
                    lastMY = my;
                    needsDraw = true;
                }

                if (needsDraw) {
                    requestAnimationFrame(draw);
                }
            });

            canvas.addEventListener('mouseup', () => {
                draggedCard = null;
                isDraggingCanvas = false;
                canvas.style.cursor = 'initial';
                needsDraw = true;
                draw();
            });

            canvas.addEventListener('mouseleave', () => {
                draggedCard = null;
                isDraggingCanvas = false;
            });

            canvas.addEventListener('wheel', e => {
                e.preventDefault();
                const factor = Math.exp(-e.deltaY * 0.0015);
                const mx = e.clientX;
                const my = e.clientY;
                const wx = (mx - offsetX) / scale;
                const wy = (my - offsetY) / scale;

                scale *= factor;
                scale = Math.max(0.05, Math.min(scale, 5));

                offsetX = mx - wx * scale;
                offsetY = my - wy * scale;

                needsDraw = true;
                draw();
            });

            canvas.addEventListener('click', e => {
                if (draggedCard || isDraggingCanvas) return;

                const mx = e.clientX;
                const my = e.clientY;

                for (const card of json.cards) {
                    const sx = w2sX(card.x);
                    const sy = w2sY(card.y + TITLE_BAR_HEIGHT);
                    const sw = w2sL(CARD_WIDTH);
                    const sh = w2sL(IMAGE_HEIGHT);

                    if (mx >= sx && mx <= sx + sw && my >= sy && my <= sy + sh) {
                        fullscreenImage.src = card.image_url;
                        fullscreenModal.style.display = 'flex';
                        return;
                    }
                }
            });

            closeModal.onclick = () => fullscreenModal.style.display = 'none';
            fullscreenModal.onclick = e => {
                if (e.target === fullscreenModal) fullscreenModal.style.display = 'none';
            };
        }

        initialize();
    </script>
</body>
</html>
